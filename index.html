<style>
:root{
  --brand1:#10b981;--brand2:#0b7a57;--brand-deep:#075c43;
  --grad:linear-gradient(135deg,#12c08a 0%,#0b7a57 100%);
  --pos:#0b7a57;--pos-soft:#e7f6ef;--neg:#c2410c;--neg-soft:#fdece2;
  --ink:#142019;--muted:#6b7772;--faint:#9aa5a0;
  --line:#e9ece9;--bg:#f3f5f3;--card:#ffffff;
  --r-sm:10px;--r:14px;--r-lg:20px;
  --shadow:0 1px 2px rgba(16,40,30,.06),0 4px 16px rgba(16,40,30,.05);
  --shadow-lg:0 8px 30px rgba(11,122,87,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;}

/* Brand header (gradient) */
.brandbar{background:var(--grad);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 26px 26px;box-shadow:var(--shadow-lg);position:relative;}
.brandbar.flat{border-radius:0 0 26px 26px;}
.brandrow{display:flex;align-items:center;gap:12px;}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;font-size:15px;backdrop-filter:blur(4px);flex-shrink:0;}
.brandname{font-size:20px;font-weight:700;letter-spacing:.2px;}
.brandname small{display:block;font-size:12px;font-weight:500;opacity:.85;letter-spacing:.3px;}
.iconbtn{background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.iconbtn:active{transform:scale(.94);}
.iconbtn.dark{background:var(--pos-soft);color:var(--brand2);}

/* trip hero */
.hero{margin-top:16px;}
.hero .htotal{font-size:30px;font-weight:800;letter-spacing:-.5px;}
.hero .hlabel{font-size:12.5px;opacity:.85;font-weight:500;text-transform:uppercase;letter-spacing:.6px;}
.hero .hmeta{font-size:13px;opacity:.9;margin-top:2px;}

.content{flex:1;padding:18px 16px 110px;}

/* segmented tabs */
.seg{display:flex;background:#eef1ef;border-radius:13px;padding:4px;margin:-30px 0 18px;position:relative;box-shadow:var(--shadow);}
.seg button{flex:1;border:none;background:none;padding:10px;font-size:14px;font-weight:600;font-family:inherit;color:var(--muted);border-radius:10px;cursor:pointer;transition:.15s;}
.seg button.active{background:#fff;color:var(--brand2);box-shadow:0 1px 3px rgba(16,40,30,.12);}

/* cards & rows */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
.row{padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;}
.row + .row{border-top:1px solid var(--line);}
.row .grow{flex:1;min-width:0;}
.row .title{font-weight:600;font-size:15px;}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .amt{font-weight:700;white-space:nowrap;font-size:15px;}
.pos{color:var(--pos);}.neg{color:var(--neg);}

.pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;}
.pill.pos{background:var(--pos-soft);color:var(--brand-deep);}
.pill.neg{background:var(--neg-soft);color:var(--neg);}
.pill.flat{background:#eef1ef;color:var(--muted);}

.avatar{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex-shrink:0;}
.avatar.sm{width:32px;height:32px;font-size:12px;border-radius:10px;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;font-family:inherit;padding:14px 18px;border-radius:var(--r);border:none;background:#fff;color:var(--ink);cursor:pointer;width:100%;box-shadow:var(--shadow);}
.btn.primary{background:var(--grad);color:#fff;box-shadow:var(--shadow-lg);}
.btn.soft{background:var(--pos-soft);color:var(--brand2);box-shadow:none;}
.btn.outline{background:#fff;border:1.5px solid var(--line);box-shadow:none;}
.btn.danger{background:var(--neg-soft);color:var(--neg);box-shadow:none;}
.btn.small{width:auto;padding:9px 15px;font-size:13.5px;border-radius:11px;font-weight:600;}
.btn:active{transform:scale(.985);}
.btn:disabled{opacity:.5;}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));max-width:448px;width:calc(100% - 36px);z-index:10;}

/* forms */
label.fld{display:block;margin:16px 0 7px;font-size:13px;color:var(--muted);font-weight:600;}
.input,select.input,textarea.input{width:100%;font-size:16px;font-family:inherit;color:var(--ink);padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcfb;outline:none;transition:.15s;}
.input:focus{border-color:var(--brand1);background:#fff;box-shadow:0 0 0 3px rgba(16,185,129,.12);}
.amount-input{font-size:34px;font-weight:800;text-align:center;padding:14px;border:none;background:transparent;letter-spacing:-.5px;}
.amount-input:focus{box-shadow:none;}
.two{display:flex;gap:10px;}.two>*{flex:1;}

.pct-row{display:flex;align-items:center;gap:12px;padding:13px 16px;}
.pct-row + .pct-row{border-top:1px solid var(--line);}
.pct-input{width:70px;text-align:right;padding:9px 10px;}
.pct-total{display:flex;justify-content:space-between;padding:13px 16px;font-size:13.5px;font-weight:600;border-top:1px solid var(--line);}
.pct-total.bad{color:var(--neg);}.pct-total.ok{color:var(--pos);}

.section{font-size:12.5px;color:var(--faint);margin:20px 4px 9px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;}

.empty{text-align:center;color:var(--muted);padding:46px 24px;}
.empty .eicon{width:64px;height:64px;border-radius:20px;background:var(--pos-soft);color:var(--brand2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.empty .big{font-size:17px;color:var(--ink);margin-bottom:5px;font-weight:700;}
.empty .sub{font-size:14px;}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,30,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);animation:fade .2s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:slideup .25s cubic-bezier(.2,.8,.2,1);}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#dfe4e1;margin:6px auto 12px;}
.sheet h2{margin:0 0 4px;font-size:19px;font-weight:700;}
.sheet .ssub{color:var(--muted);font-size:14px;margin:0 0 14px;}

.banner{background:#fff8ec;border:1px solid #ffe2b3;color:#8a5a00;padding:13px 15px;border-radius:14px;font-size:13.5px;margin-bottom:16px;}
.muted{color:var(--muted);font-size:14px;}
.center{text-align:center;}
.spacer{height:8px;}
.chip{display:inline-block;background:#f1f4f2;border:1.5px solid transparent;border-radius:999px;padding:7px 14px;font-size:13.5px;margin:0 7px 8px 0;cursor:pointer;font-weight:600;color:var(--muted);}
.chip.on{background:var(--pos-soft);border-color:var(--brand1);color:var(--brand2);}
.copybtn{font-size:12.5px;}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
svg.ic.sm{width:17px;height:17px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="text/babel" data-presets="react">
const SUPA_URL = 'https://hisdnziwdlegxririysw.supabase.co';
const SUPA_KEY = 'sb_publishable__pb6Mhd4LtoFtGm2rChzRg_4vJR4KKt';
const SB = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// === Email notifications (EmailJS) ===
// Fill these 3 values after creating a free EmailJS account to turn on
// email alerts when someone adds an expense. Leave blank to disable.
const EMAILJS = { publicKey: '', serviceId: '', templateId: '' };
const emailReady = () => EMAILJS.publicKey && EMAILJS.serviceId && EMAILJS.templateId && window.emailjs;
if (EMAILJS.publicKey && window.emailjs) { try { window.emailjs.init({ publicKey: EMAILJS.publicKey }); } catch(e){} }
async function notifyExpense(trip, members, expense, payerName){
  if (!emailReady()) return;
  const recips = members.filter(m => m.email && m.id !== expense.paid_by);
  for (const m of recips){
    try {
      await window.emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {
        to_email: m.email, to_name: m.name, trip_name: trip.name,
        payer: payerName, description: expense.description,
        amount: formatMoney(expense.amount, trip.currency),
        app_url: window.location.origin + window.location.pathname
      });
    } catch(e){}
  }
}

const { useState, useEffect, useCallback } = React;
const COLORS = ['#10b981','#0ea5e9','#f43f5e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];
const CATEGORIES = ['Food','Stay','Transport','Activities','Shopping','Other'];

const KNOWN='tripsplit.trips';
const getKnown=()=>{try{return JSON.parse(localStorage.getItem(KNOWN)||'[]');}catch{return[];}};
const addKnown=(id)=>{const s=new Set(getKnown());s.add(id);localStorage.setItem(KNOWN,JSON.stringify([...s]));};
const removeKnown=(id)=>{localStorage.setItem(KNOWN,JSON.stringify(getKnown().filter(x=>x!==id)));};
const getMe=(t)=>localStorage.getItem('tripsplit.me.'+t)||'';
const setMe=(t,m)=>localStorage.setItem('tripsplit.me.'+t,m);
const initials=(n)=>(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

function computeBalances(members,expenses,settlements){
  const net={};members.forEach(m=>net[m.id]=0);
  expenses.forEach(e=>{const a=Number(e.amount)||0;if(net[e.paid_by]!==undefined)net[e.paid_by]+=a;members.forEach(m=>{net[m.id]-=a*(Number(m.percent)||0)/100;});});
  settlements.forEach(s=>{const a=Number(s.amount)||0;if(net[s.from_member]!==undefined)net[s.from_member]+=a;if(net[s.to_member]!==undefined)net[s.to_member]-=a;});
  Object.keys(net).forEach(k=>net[k]=Math.round(net[k]*100)/100);return net;
}
function simplifyDebts(net){
  const cr=[],de=[];Object.entries(net).forEach(([id,v])=>{if(v>0.005)cr.push({id,amount:v});else if(v<-0.005)de.push({id,amount:-v});});
  cr.sort((a,b)=>b.amount-a.amount);de.sort((a,b)=>b.amount-a.amount);
  const tr=[];let i=0,j=0;
  while(i<de.length&&j<cr.length){const pay=Math.min(de[i].amount,cr[j].amount);tr.push({from:de[i].id,to:cr[j].id,amount:Math.round(pay*100)/100});de[i].amount-=pay;cr[j].amount-=pay;if(de[i].amount<0.005)i++;if(cr[j].amount<0.005)j++;}
  return tr;
}
function formatMoney(amount,currency='EGP'){
  const n=(Math.round((Number(amount)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return currency+' '+n;
}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});}catch{return d;}}
function parseHash(){const m=(window.location.hash||'').match(/^#\/trip\/([0-9a-f-]+)/i);return m?{name:'trip',id:m[1]}:{name:'home'};}
const goTrip=(id)=>{window.location.hash='#/trip/'+id;};
const goHome=()=>{window.location.hash='';};
const shareLink=(id)=>window.location.origin+window.location.pathname+'#/trip/'+id;

// --- icons ---
const Ic=({d,sm})=>(<svg className={'ic'+(sm?' sm':'')} viewBox="0 0 24 24" aria-hidden="true"><path d={d}/></svg>);
const I={
  back:'M15 18l-6-6 6-6', plus:'M12 5v14M5 12h14', share:'M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13',
  edit:'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z', trash:'M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6',
  users:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75',
  receipt:'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1zM8 7h8M8 11h8M8 15h5',
  check:'M20 6L9 17l-5-5', mail:'M4 4h16v16H4zM4 6l8 6 8-6'
};

function App(){
  const [route,setRoute]=useState(parseHash());
  useEffect(()=>{const f=()=>setRoute(parseHash());window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f);},[]);
  if(route.name==='trip')return <TripScreen tripId={route.id} key={route.id}/>;
  return <HomeScreen/>;
}

function HomeScreen(){
  const [trips,setTrips]=useState([]);const [loading,setLoading]=useState(true);
  const [showNew,setShowNew]=useState(false);const [showJoin,setShowJoin]=useState(false);
  const load=useCallback(async()=>{
    setLoading(true);const ids=getKnown();
    if(ids.length===0){setTrips([]);setLoading(false);return;}
    const {data:tripRows}=await SB.from('trips').select('*').in('id',ids);
    const out=[];
    for(const t of (tripRows||[])){
      const [{data:members},{data:expenses},{data:settlements}]=await Promise.all([
        SB.from('members').select('*').eq('trip_id',t.id),
        SB.from('expenses').select('*').eq('trip_id',t.id),
        SB.from('settlements').select('*').eq('trip_id',t.id),
      ]);
      const net=computeBalances(members||[],expenses||[],settlements||[]);const me=getMe(t.id);
      out.push({...t,memberCount:(members||[]).length,expenseCount:(expenses||[]).length,myNet:me?(net[me]||0):null});
    }
    out.sort((a,b)=>ids.indexOf(b.id)-ids.indexOf(a.id));
    setTrips(out);setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);
  return (
    <div className="app">
      <div className="brandbar flat">
        <div className="brandrow">
          <div className="logo">BT</div>
          <div className="grow"><div className="brandname">Bokha tripsplit<small>Split trip costs with friends</small></div></div>
          <button className="iconbtn" onClick={()=>setShowJoin(true)} aria-label="Join trip"><Ic d={I.users}/></button>
        </div>
      </div>
      <div className="content" style={{paddingTop:20}}>
        {loading && <p className="muted center" style={{marginTop:30}}>Loading…</p>}
        {!loading && trips.length===0 && <div className="empty"><div className="eicon"><Ic d={I.receipt}/></div><div className="big">No trips yet</div><div className="sub">Create a trip, add your friends, then start logging expenses together.</div></div>}
        {!loading && trips.length>0 && <div className="card">
          {trips.map(t=>(
            <div className="row" key={t.id} onClick={()=>goTrip(t.id)}>
              <div className="avatar" style={{background:'linear-gradient(135deg,#12c08a,#0b7a57)'}}>{initials(t.name)}</div>
              <div className="grow"><div className="title">{t.name}</div><div className="meta">{t.memberCount} members · {t.expenseCount} expenses</div></div>
              {t.myNet!==null && Math.abs(t.myNet)>0.005 && <span className={'pill '+(t.myNet>0?'pos':'neg')}>{t.myNet>0?'+':'−'}{formatMoney(Math.abs(t.myNet),t.currency)}</span>}
            </div>
          ))}
        </div>}
        <button className="btn primary" onClick={()=>setShowNew(true)} style={{marginTop:8}}><Ic d={I.plus}/> New trip</button>
      </div>
      {showNew && <NewTripSheet onClose={()=>setShowNew(false)} onCreated={(id)=>{addKnown(id);goTrip(id);}}/>}
      {showJoin && <JoinSheet onClose={()=>setShowJoin(false)} onJoined={(id)=>{addKnown(id);goTrip(id);}}/>}
    </div>
  );
}

function NewTripSheet({onClose,onCreated}){
  const [name,setName]=useState('');const [currency,setCurrency]=useState('EGP');const [busy,setBusy]=useState(false);
  const create=async()=>{if(!name.trim())return;setBusy(true);
    const {data,error}=await SB.from('trips').insert({name:name.trim(),currency:currency.trim()||'EGP'}).select().single();
    setBusy(false);if(error){alert('Could not create trip: '+error.message);return;}onCreated(data.id);};
  return (<Sheet onClose={onClose} title="New trip" sub="Give it a name. You'll add members next.">
    <label className="fld">Trip name</label>
    <input className="input" autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Greece 2026"/>
    <label className="fld">Currency</label>
    <input className="input" value={currency} onChange={e=>setCurrency(e.target.value)} placeholder="EGP"/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!name.trim()} onClick={create}>{busy?'Creating…':'Create trip'}</button>
  </Sheet>);
}

function JoinSheet({onClose,onJoined}){
  const [code,setCode]=useState('');const [busy,setBusy]=useState(false);
  const join=async()=>{const c=code.trim().toUpperCase();if(!c)return;setBusy(true);
    const {data}=await SB.from('trips').select('id').eq('join_code',c).maybeSingle();
    setBusy(false);if(!data){alert('No trip found with that code.');return;}onJoined(data.id);};
  return (<Sheet onClose={onClose} title="Join a trip" sub="Enter the 6-character code a friend shared.">
    <input className="input" autoFocus value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="ABC123" maxLength={6} style={{textTransform:'uppercase',letterSpacing:'3px',textAlign:'center',fontSize:22,fontWeight:700}}/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!code.trim()} onClick={join}>{busy?'Joining…':'Join trip'}</button>
  </Sheet>);
}

function TripScreen({tripId}){
  const [trip,setTrip]=useState(null);const [members,setMembers]=useState([]);const [expenses,setExpenses]=useState([]);const [settlements,setSettlements]=useState([]);
  const [tab,setTab]=useState('balances');const [loading,setLoading]=useState(true);
  const [addOpen,setAddOpen]=useState(false);const [editExp,setEditExp]=useState(null);const [showShare,setShowShare]=useState(false);const [notFound,setNotFound]=useState(false);
  const load=useCallback(async()=>{
    const {data:t}=await SB.from('trips').select('*').eq('id',tripId).maybeSingle();
    if(!t){setNotFound(true);setLoading(false);return;}
    addKnown(tripId);
    const [{data:m},{data:e},{data:s}]=await Promise.all([
      SB.from('members').select('*').eq('trip_id',tripId).order('created_at'),
      SB.from('expenses').select('*').eq('trip_id',tripId).order('spent_on',{ascending:false}).order('created_at',{ascending:false}),
      SB.from('settlements').select('*').eq('trip_id',tripId),
    ]);
    setTrip(t);setMembers(m||[]);setExpenses(e||[]);setSettlements(s||[]);setLoading(false);
  },[tripId]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{
    const ch=SB.channel('trip-'+tripId)
      .on('postgres_changes',{event:'*',schema:'public',table:'expenses',filter:'trip_id=eq.'+tripId},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'trip_id=eq.'+tripId},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'settlements',filter:'trip_id=eq.'+tripId},load)
      .subscribe();
    return()=>{SB.removeChannel(ch);};
  },[tripId,load]);
  if(loading)return <div className="app"><div className="brandbar"><div className="brandrow"><button className="iconbtn" onClick={goHome}><Ic d={I.back}/></button><div className="brandname">Trip</div></div></div><p className="muted center" style={{marginTop:40}}>Loading…</p></div>;
  if(notFound)return <div className="app"><div className="brandbar"><div className="brandrow"><button className="iconbtn" onClick={goHome}><Ic d={I.back}/></button><div className="brandname">Trip</div></div></div><div className="empty"><div className="big">Trip not found</div><div className="sub">The link or code may be wrong.</div></div></div>;
  const total=expenses.reduce((s,e)=>s+Number(e.amount),0);const cur=trip.currency||'EGP';const me=getMe(tripId);
  return (
    <div className="app">
      <div className="brandbar">
        <div className="brandrow">
          <button className="iconbtn" onClick={goHome} aria-label="Back"><Ic d={I.back}/></button>
          <div className="grow"><div className="brandname" style={{fontSize:18}}>{trip.name}</div></div>
          <button className="iconbtn" onClick={()=>setShowShare(true)} aria-label="Share"><Ic d={I.share}/></button>
        </div>
        <div className="hero">
          <div className="hlabel">Total spent</div>
          <div className="htotal">{formatMoney(total,cur)}</div>
          <div className="hmeta">{members.length} members · {expenses.length} expenses</div>
        </div>
      </div>
      <div className="content">
        <div className="seg">
          <button className={tab==='balances'?'active':''} onClick={()=>setTab('balances')}>Balances</button>
          <button className={tab==='expenses'?'active':''} onClick={()=>setTab('expenses')}>Expenses</button>
          <button className={tab==='members'?'active':''} onClick={()=>setTab('members')}>Members</button>
        </div>
        {!me && members.length>0 && <WhoAmI members={members} tripId={tripId} onPick={load}/>}
        {tab==='balances' && <BalancesTab trip={trip} members={members} expenses={expenses} settlements={settlements} onChange={load}/>}
        {tab==='expenses' && <ExpensesTab trip={trip} members={members} expenses={expenses} onEdit={setEditExp}/>}
        {tab==='members' && <MembersTab trip={trip} members={members} onChange={load}/>}
      </div>
      {members.length>0 && tab!=='members' && <button className="btn primary fab" onClick={()=>setAddOpen(true)}><Ic d={I.plus}/> Add expense</button>}
      {addOpen && <ExpenseSheet trip={trip} members={members} onClose={()=>setAddOpen(false)} onSaved={()=>{setAddOpen(false);load();}}/>}
      {editExp && <ExpenseSheet trip={trip} members={members} expense={editExp} onClose={()=>setEditExp(null)} onSaved={()=>{setEditExp(null);load();}}/>}
      {showShare && <ShareSheet trip={trip} onClose={()=>setShowShare(false)}/>}
    </div>
  );
}

function WhoAmI({members,tripId,onPick}){
  return (<div className="banner"><b>Which member are you</b> on this phone?
    <div style={{marginTop:8}}>{members.map(m=><span key={m.id} className="chip" onClick={()=>{setMe(tripId,m.id);onPick();}}>{m.name}</span>)}</div>
  </div>);
}

function BalancesTab({trip,members,expenses,settlements,onChange}){
  const cur=trip.currency||'EGP';const net=computeBalances(members,expenses,settlements);const transfers=simplifyDebts(net);
  const nameOf=(id)=>(members.find(m=>m.id===id)||{}).name||'?';const colorOf=(id)=>(members.find(m=>m.id===id)||{}).color||'#888';const me=getMe(trip.id);
  const settle=async(t)=>{if(!confirm('Mark '+nameOf(t.from)+' → '+nameOf(t.to)+' '+formatMoney(t.amount,cur)+' as paid?'))return;
    const {error}=await SB.from('settlements').insert({trip_id:trip.id,from_member:t.from,to_member:t.to,amount:t.amount});
    if(error){alert(error.message);return;}onChange();};
  if(members.length===0)return <div className="empty"><div className="eicon"><Ic d={I.users}/></div><div className="big">No members yet</div><div className="sub">Add members in the Members tab first.</div></div>;
  return (<React.Fragment>
    <div className="section">Who owes whom</div>
    {transfers.length===0
      ? <div className="card"><div className="row" style={{cursor:'default'}}><div className="avatar sm" style={{background:'var(--pos-soft)',color:'var(--brand2)'}}><Ic d={I.check} sm/></div><div className="grow"><div className="title">All settled up</div><div className="meta">No outstanding balances.</div></div></div></div>
      : <div className="card">{transfers.map((t,i)=>(
          <div className="row" key={i} style={{cursor:'default'}}>
            <div className="avatar sm" style={{background:colorOf(t.from)}}>{initials(nameOf(t.from))}</div>
            <div className="grow"><div className="title" style={{fontSize:14.5}}>{nameOf(t.from)} <span className="muted">pays</span> {nameOf(t.to)}</div><div className="meta pos" style={{fontWeight:700,color:'var(--pos)'}}>{formatMoney(t.amount,cur)}</div></div>
            <button className="btn small soft" onClick={()=>settle(t)}>Settle</button>
          </div>))}
        </div>}
    <div className="section">Net per person</div>
    <div className="card">{members.map(m=>{const v=net[m.id]||0;return (
      <div className="row" key={m.id} style={{cursor:'default'}}>
        <div className="avatar sm" style={{background:m.color}}>{initials(m.name)}</div>
        <div className="grow"><div className="title">{m.name}{m.id===me?' · you':''}</div><div className="meta">{Number(m.percent)}% share</div></div>
        {Math.abs(v)<0.005?<span className="pill flat">settled</span>:<span className={'pill '+(v>0?'pos':'neg')}>{v>0?'+':'−'}{formatMoney(Math.abs(v),cur)}</span>}
      </div>);})}
    </div>
  </React.Fragment>);
}

function ExpensesTab({trip,members,expenses,onEdit}){
  const cur=trip.currency||'EGP';const nameOf=(id)=>(members.find(m=>m.id===id)||{}).name||'?';const colorOf=(id)=>(members.find(m=>m.id===id)||{}).color||'#888';
  if(expenses.length===0)return <div className="empty"><div className="eicon"><Ic d={I.receipt}/></div><div className="big">No expenses yet</div><div className="sub">Tap “Add expense” to log the first one.</div></div>;
  return (<div className="card">
    {expenses.map(e=>(
      <div className="row" key={e.id} onClick={()=>onEdit(e)}>
        <div className="avatar sm" style={{background:colorOf(e.paid_by)}}>{initials(nameOf(e.paid_by))}</div>
        <div className="grow"><div className="title">{e.description}</div><div className="meta">{nameOf(e.paid_by)} paid · {e.category?e.category+' · ':''}{fmtDate(e.spent_on)}</div></div>
        <div className="amt">{formatMoney(e.amount,cur)}</div>
        <span className="muted" style={{color:'var(--faint)'}}><Ic d={I.edit} sm/></span>
      </div>))}
  </div>);
}

function MembersTab({trip,members,onChange}){
  const [local,setLocal]=useState(members.map(m=>({...m})));const [newName,setNewName]=useState('');const [newEmail,setNewEmail]=useState('');const [busy,setBusy]=useState(false);const [editM,setEditM]=useState(null);
  useEffect(()=>{setLocal(members.map(m=>({...m})));},[members]);
  const total=local.reduce((s,m)=>s+(Number(m.percent)||0),0);const totalRounded=Math.round(total*100)/100;
  const setPct=(id,val)=>setLocal(local.map(m=>m.id===id?{...m,percent:val}:m));
  const splitEqually=()=>{const n=local.length;if(n===0)return;const each=Math.floor((100/n)*100)/100;const next=local.map(m=>({...m,percent:each}));const used=each*n;next[0].percent=Math.round((each+(100-used))*100)/100;setLocal(next);};
  const addMember=async()=>{if(!newName.trim())return;setBusy(true);const color=COLORS[members.length%COLORS.length];
    const {error}=await SB.from('members').insert({trip_id:trip.id,name:newName.trim(),email:newEmail.trim()||null,color,percent:0});setBusy(false);
    if(error){alert(error.message);return;}setNewName('');setNewEmail('');onChange();};
  const savePercents=async()=>{setBusy(true);for(const m of local){await SB.from('members').update({percent:Number(m.percent)||0}).eq('id',m.id);}setBusy(false);onChange();};
  return (<React.Fragment>
    <div className="section">Members &amp; contribution %</div>
    <div className="card">
      {local.length===0 && <div className="row" style={{cursor:'default'}}><div className="grow muted">No members yet. Add the first below.</div></div>}
      {local.map(m=>(
        <div className="pct-row" key={m.id}>
          <div className="avatar sm" style={{background:m.color}}>{initials(m.name)}</div>
          <div className="grow" onClick={()=>setEditM(m)} style={{cursor:'pointer'}}><div className="title">{m.name}</div><div className="meta">{m.email||'no email'}</div></div>
          <input className="input pct-input" type="number" inputMode="decimal" min="0" max="100" value={m.percent} onChange={e=>setPct(m.id,e.target.value)}/>
          <span className="muted">%</span>
        </div>))}
      {local.length>0 && <div className={'pct-total '+(Math.abs(totalRounded-100)<0.005?'ok':'bad')}><span>Total</span><span>{totalRounded}% {Math.abs(totalRounded-100)<0.005?'✓':'(must be 100%)'}</span></div>}
    </div>
    {local.length>0 && <div className="two"><button className="btn outline" onClick={splitEqually}>Split equally</button><button className="btn primary" disabled={busy} onClick={savePercents}>{busy?'Saving…':'Save %'}</button></div>}
    <div className="section">Add member</div>
    <div className="card" style={{padding:14}}>
      <input className="input" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Name"/>
      <div style={{height:10}}/>
      <input className="input" type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)} placeholder="Email (optional — for notifications)"/>
      <div style={{height:12}}/>
      <button className="btn primary" disabled={busy||!newName.trim()} onClick={addMember}><Ic d={I.plus}/> Add member</button>
    </div>
    {editM && <MemberSheet trip={trip} member={editM} onClose={()=>setEditM(null)} onSaved={()=>{setEditM(null);onChange();}}/>}
  </React.Fragment>);
}

function MemberSheet({trip,member,onClose,onSaved}){
  const [name,setName]=useState(member.name);const [email,setEmail]=useState(member.email||'');const [busy,setBusy]=useState(false);
  const save=async()=>{if(!name.trim())return;setBusy(true);
    const {error}=await SB.from('members').update({name:name.trim(),email:email.trim()||null}).eq('id',member.id);setBusy(false);
    if(error){alert(error.message);return;}onSaved();};
  const del=async()=>{if(!confirm('Remove '+member.name+'? Their expenses will also be removed.'))return;setBusy(true);await SB.from('members').delete().eq('id',member.id);setBusy(false);onSaved();};
  return (<Sheet onClose={onClose} title="Edit member">
    <label className="fld">Name</label>
    <input className="input" value={name} onChange={e=>setName(e.target.value)}/>
    <label className="fld">Email (optional)</label>
    <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@email.com"/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!name.trim()} onClick={save}>{busy?'Saving…':'Save'}</button>
    <div style={{height:10}}/>
    <button className="btn danger" disabled={busy} onClick={del}><Ic d={I.trash} sm/> Remove member</button>
  </Sheet>);
}

function ExpenseSheet({trip,members,expense,onClose,onSaved}){
  const editing=!!expense;const cur=trip.currency||'EGP';const me=getMe(trip.id);
  const [amount,setAmount]=useState(expense?String(expense.amount):'');
  const [desc,setDesc]=useState(expense?expense.description:'');
  const [category,setCategory]=useState(expense?(expense.category||''):'');
  const [paidBy,setPaidBy]=useState(expense?expense.paid_by:(me||(members[0]&&members[0].id)||''));
  const [date,setDate]=useState(expense?expense.spent_on:new Date().toISOString().slice(0,10));
  const [busy,setBusy]=useState(false);
  const amt=Number(amount)||0;
  const save=async()=>{if(!amt||!desc.trim()||!paidBy)return;setBusy(true);
    const payload={trip_id:trip.id,description:desc.trim(),amount:amt,category:category||null,paid_by:paidBy,spent_on:date};
    let error;
    if(editing){({error}=await SB.from('expenses').update(payload).eq('id',expense.id));}
    else{({error}=await SB.from('expenses').insert(payload));}
    setBusy(false);if(error){alert(error.message);return;}
    if(!editing){const payer=(members.find(m=>m.id===paidBy)||{}).name||'Someone';notifyExpense(trip,members,payload,payer);}
    onSaved();};
  const del=async()=>{if(!confirm('Delete this expense?'))return;setBusy(true);await SB.from('expenses').delete().eq('id',expense.id);setBusy(false);onSaved();};
  return (<Sheet onClose={onClose} title={editing?'Edit expense':'New expense'}>
    <div className="card" style={{padding:'6px 0',marginBottom:14}}>
      <input className="input amount-input" type="number" inputMode="decimal" autoFocus={!editing} value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00"/>
      <div className="center muted" style={{marginTop:-2,fontWeight:600}}>{cur}</div>
    </div>
    <label className="fld">Description</label>
    <input className="input" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="e.g. Dinner at the taverna"/>
    <label className="fld">Category (optional)</label>
    <div>{CATEGORIES.map(c=><span key={c} className={'chip'+(category===c?' on':'')} onClick={()=>setCategory(category===c?'':c)}>{c}</span>)}</div>
    <div className="two">
      <div><label className="fld">Paid by</label>
        <select className="input" value={paidBy} onChange={e=>setPaidBy(e.target.value)}>{members.map(m=><option key={m.id} value={m.id}>{m.name}{m.id===me?' (you)':''}</option>)}</select>
      </div>
      <div><label className="fld">Date</label><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
    </div>
    {amt>0 && <React.Fragment>
      <label className="fld">Split by contribution %</label>
      <div className="card">{members.map(m=>(
        <div className="row" key={m.id} style={{cursor:'default',padding:'11px 16px'}}>
          <div className="avatar sm" style={{background:m.color}}>{initials(m.name)}</div>
          <div className="grow"><span className="muted">{m.name} · {Number(m.percent)}%</span></div>
          <div className="amt" style={{fontSize:14}}>{formatMoney(amt*(Number(m.percent)||0)/100,cur)}</div>
        </div>))}
      </div>
    </React.Fragment>}
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!amt||!desc.trim()||!paidBy} onClick={save}>{busy?'Saving…':(editing?'Save changes':'Save expense')}</button>
    {editing && <React.Fragment><div style={{height:10}}/><button className="btn danger" disabled={busy} onClick={del}><Ic d={I.trash} sm/> Delete expense</button></React.Fragment>}
  </Sheet>);
}

function ShareSheet({trip,onClose}){
  const link=shareLink(trip.id);const [copied,setCopied]=useState('');
  const copy=async(text,what)=>{try{await navigator.clipboard.writeText(text);setCopied(what);setTimeout(()=>setCopied(''),1500);}catch{prompt('Copy this:',text);}};
  return (<Sheet onClose={onClose} title="Share this trip" sub="Send the link or code to your friends so they can join from their phones.">
    <label className="fld">Join code</label>
    <div className="card"><div className="row" style={{cursor:'default'}}>
      <div className="grow" style={{fontSize:24,letterSpacing:4,fontWeight:800}}>{trip.join_code}</div>
      <button className="btn small soft copybtn" onClick={()=>copy(trip.join_code,'code')}>{copied==='code'?'Copied':'Copy'}</button>
    </div></div>
    <label className="fld">Direct link</label>
    <div className="card"><div className="row" style={{cursor:'default'}}>
      <div className="grow muted" style={{fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{link}</div>
      <button className="btn small soft copybtn" onClick={()=>copy(link,'link')}>{copied==='link'?'Copied':'Copy'}</button>
    </div></div>
    <div className="spacer"/>
    <button className="btn outline" onClick={()=>{removeKnown(trip.id);goHome();}} style={{color:'var(--neg)'}}>Remove this trip from my phone</button>
  </Sheet>);
}

function Sheet({title,sub,children,onClose}){
  return (<div className="sheet-bg" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grab"/><h2>{title}</h2>{sub && <p className="ssub">{sub}</p>}{children}</div></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});}); }
</script>
</body>
</html>
