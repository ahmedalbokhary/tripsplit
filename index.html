function HomeScreen(){
  const [trips,setTrips]=useState([]);const [loading,setLoading]=useState(true);const [err,setErr]=useState(false);
  const [showNew,setShowNew]=useState(false);const [showJoin,setShowJoin]=useState(false);
  const load=useCallback(async()=>{
    setErr(false);setLoading(true);const ids=getKnown();
    if(ids.length===0){setTrips([]);setLoading(false);return;}
    try{
      const out=[];
      for(const id of ids){
        const {data:t,error}=await SB.rpc('join_trip',{p_id:id});
        if(error)throw error;
        if(!t)continue;
        const [{data:members},{data:expenses},{data:settlements}]=await Promise.all([
          SB.from('members').select('*').eq('trip_id',id),SB.from('expenses').select('*').eq('trip_id',id),SB.from('settlements').select('*').eq('trip_id',id),
        ]);
        const net=computeBalances(members||[],expenses||[],settlements||[]);const me=getMe(id);
        out.push({...t,memberCount:(members||[]).length,expenseCount:(expenses||[]).length,myNet:me?(net[me]||0):null});
      }
      out.sort((a,b)=>ids.indexOf(b.id)-ids.indexOf(a.id));setTrips(out);
    }catch(e){setErr(true);}
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);
  return (
    <div className="app">
      <div className="brandbar">
        <div className="brandrow">
          <div className="logo">BT</div>
          <div className="grow"><div className="brandname">Bokha tripsplit<small>Split trip costs with friends</small></div></div>
          <button className="iconbtn" onClick={()=>setShowJoin(true)} aria-label="Join trip"><Ic d={I.users}/></button>
        </div>
      </div>
      <div className="content nonav">
        {loading && <div><div className="skel"/><div className="skel" style={{opacity:.6}}/></div>}
        {!loading && err && <ErrState onRetry={load}/>}
        {!loading && !err && trips.length===0 && <div className="empty"><div className="eicon"><Ic d={I.receipt}/></div><div className="big">No trips yet</div><div className="sub">Create a trip, add your friends, then start logging expenses together.</div></div>}
        {!loading && !err && trips.length>0 && <div className="card">
          {trips.map(t=>(
            <div className="row" key={t.id} onClick={()=>goTrip(t.id)}>
              <div className="avatar" style={{background:'linear-gradient(135deg,#38bdf8,#1e6fd9)'}}>{initials(t.name)}</div>
              <div className="grow"><div className="title">{t.name}</div><div className="meta"><Ic d={I.users} sm/>{t.memberCount} · <Ic d={I.receipt} sm/>{t.expenseCount}</div></div>
              {t.myNet!==null && Math.abs(t.myNet)>0.005 && <span className={'pill '+(t.myNet>0?'pos':'neg')}>{t.myNet>0?'+':'−'}{formatMoney(Math.abs(t.myNet),t.currency)}</span>}
              <Ic d={I.arrowr} sm/>
            </div>
          ))}
        </div>}
        {!loading && !err && <button className="btn primary" onClick={()=>setShowNew(true)} style={{marginTop:8}}><Ic d={I.plus}/> New trip</button>}
      </div>
      {showNew && <NewTripSheet onClose={()=>setShowNew(false)} onCreated={(id)=>{addKnown(id);goTrip(id);}}/>}
      {showJoin && <JoinSheet onClose={()=>setShowJoin(false)} onJoined={(id)=>{addKnown(id);goTrip(id);}}/>}
    </div>
  );
}

function NewTripSheet({onClose,onCreated}){
  const [name,setName]=useState('');const [currency,setCurrency]=useState('EGP');const [busy,setBusy]=useState(false);
  const create=async()=>{if(!name.trim())return;setBusy(true);
    const {data,error}=await SB.rpc('create_trip',{p_name:name.trim(),p_currency:currency.trim()||'EGP'});
    setBusy(false);if(error||!data){alert('Could not create trip: '+((error&&error.message)||'unknown error'));return;}onCreated(data.id);};
  return (<Sheet onClose={onClose} title="New trip" sub="Give it a name. You'll add members next.">
    <label className="fld">Trip name</label>
    <input className="input" autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Greece 2026" maxLength={40}/>
    <label className="fld">Currency</label>
    <input className="input" value={currency} onChange={e=>setCurrency(e.target.value)} placeholder="EGP" maxLength={8}/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!name.trim()} onClick={create}>{busy?'Creating…':'Create trip'}</button>
  </Sheet>);
}
function JoinSheet({onClose,onJoined}){
  const [code,setCode]=useState('');const [busy,setBusy]=useState(false);
  const join=async()=>{const c=code.trim().toUpperCase();if(!c)return;setBusy(true);
    const {data,error}=await SB.rpc('join_trip',{p_code:c});
    setBusy(false);if(error||!data){alert('No trip found with that code.');return;}onJoined(data.id);};
  return (<Sheet onClose={onClose} title="Join a trip" sub="Enter the 6-character code a friend shared.">
    <input className="input" autoFocus value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="ABC123" maxLength={6} style={{textTransform:'uppercase',letterSpacing:'4px',textAlign:'center',fontSize:24,fontWeight:800}}/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!code.trim()} onClick={join}>{busy?'Joining…':'Join trip'}</button>
  </Sheet>);
}

function TripScreen({tripId}){
  const [trip,setTrip]=useState(null);const [members,setMembers]=useState([]);const [expenses,setExpenses]=useState([]);const [settlements,setSettlements]=useState([]);
  const [tab,setTab]=useState('balances');const [loading,setLoading]=useState(true);
  const [addOpen,setAddOpen]=useState(false);const [editExp,setEditExp]=useState(null);const [showShare,setShowShare]=useState(false);const [showEdit,setShowEdit]=useState(false);const [notFound,setNotFound]=useState(false);const [err,setErr]=useState(false);
  const load=useCallback(async()=>{
    setErr(false);
    try{
      const {data:t,error}=await SB.rpc('join_trip',{p_id:tripId});
      if(error)throw error;
      if(!t){setNotFound(true);setLoading(false);return;}
      addKnown(tripId);
      const [{data:m},{data:e},{data:s}]=await Promise.all([
        SB.from('members').select('*').eq('trip_id',tripId).order('created_at'),
        SB.from('expenses').select('*').eq('trip_id',tripId).order('spent_on',{ascending:false}).order('created_at',{ascending:false}),
        SB.from('settlements').select('*').eq('trip_id',tripId),
      ]);
      setTrip(t);setMembers(m||[]);setExpenses(e||[]);setSettlements(s||[]);
    }catch(e){setErr(true);}
    setLoading(false);
  },[tripId]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{
    const ch=SB.channel('trip-'+tripId)
      .on('postgres_changes',{event:'*',schema:'public',table:'expenses',filter:'trip_id=eq.'+tripId},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'trip_id=eq.'+tripId},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'settlements',filter:'trip_id=eq.'+tripId},load)
      .subscribe();
    return()=>{SB.removeChannel(ch);};
  },[tripId,load]);
  useEffect(()=>{const f=()=>{if(document.visibilityState==='visible')load();};document.addEventListener('visibilitychange',f);return()=>document.removeEventListener('visibilitychange',f);},[load]);
  if(loading)return <div className="app"><div className="brandbar"><div className="brandrow"><button className="iconbtn" onClick={goHome}><Ic d={I.back}/></button><div className="brandname" style={{fontSize:18}}>Trip</div></div></div><Loader/></div>;
  if(notFound)return <div className="app"><div className="brandbar"><div className="brandrow"><button className="iconbtn" onClick={goHome}><Ic d={I.back}/></button><div className="brandname" style={{fontSize:18}}>Trip</div></div></div><div className="empty"><div className="eicon"><Ic d={I.x}/></div><div className="big">Trip not found</div><div className="sub">The link or code may be wrong.</div></div></div>;
  if(!trip)return <div className="app"><div className="brandbar"><div className="brandrow"><button className="iconbtn" onClick={goHome}><Ic d={I.back}/></button><div className="brandname" style={{fontSize:18}}>Trip</div></div></div><ErrState onRetry={load}/></div>;
  const total=expenses.reduce((s,e)=>s+Number(e.amount),0);const cur=trip.currency||'EGP';const me=getMe(tripId);const hasM=members.length>0;
  return (
    <div className="app">
      <div className="brandbar">
        <div className="brandtag"><span className="bt-mini">BT</span>Bokha tripsplit</div>
        <div className="brandrow">
          <button className="iconbtn" onClick={goHome} aria-label="Back"><Ic d={I.back}/></button>
          <div className="grow" onClick={()=>setShowEdit(true)} style={{cursor:'pointer'}}><div className="brandname" style={{fontSize:18,display:'flex',alignItems:'center',gap:7}}>{trip.name}<span style={{opacity:.8}}><Ic d={I.edit} sm/></span></div></div>
          <button className="iconbtn" onClick={()=>setShowShare(true)} aria-label="Share"><Ic d={I.share}/></button>
        </div>
        <div className="hero">
          <div className="hlabel">Total spent</div>
          <div className="htotal">{formatMoney(total,cur)}</div>
          <div className="hmeta">{trip.start_date&&trip.end_date?fmtDate(trip.start_date)+' – '+fmtDate(trip.end_date)+' · ':''}{members.length} members · {expenses.length} expenses</div>
        </div>
      </div>
      <div className="content" key={tab}>
        {!me && hasM && <WhoAmI members={members} tripId={tripId} onPick={load}/>}
        {tab==='balances' && <BalancesTab trip={trip} members={members} expenses={expenses} settlements={settlements} onChange={load}/>}
        {tab==='expenses' && <ExpensesTab trip={trip} members={members} expenses={expenses} onEdit={setEditExp}/>}
        {tab==='members' && <MembersTab trip={trip} members={members} onChange={load}/>}
        {tab==='summary' && <SummaryTab trip={trip} members={members} expenses={expenses} settlements={settlements}/>}
      </div>

      <div className="tabbar" role="navigation" aria-label="Trip sections">
        <button className={'tabitem'+(tab==='balances'?' active':'')} onClick={()=>setTab('balances')}><Ic d={I.scale}/>Balances</button>
        <button className={'tabitem'+(tab==='expenses'?' active':'')} onClick={()=>setTab('expenses')}><Ic d={I.receipt}/>Expenses</button>
        <div className="tabitem spacer">.</div>
        <button className={'tabitem'+(tab==='members'?' active':'')} onClick={()=>setTab('members')}><Ic d={I.users}/>Members</button>
        <button className={'tabitem'+(tab==='summary'?' active':'')} onClick={()=>setTab('summary')}><Ic d={I.chart}/>Summary</button>
      </div>
      {hasM && <button className="navfab" onClick={()=>setAddOpen(true)} aria-label="Add expense"><Ic d={I.plus}/></button>}

      {addOpen && <ExpenseSheet trip={trip} members={members} onClose={()=>setAddOpen(false)} onSaved={()=>{setAddOpen(false);load();}}/>}
      {editExp && <ExpenseSheet trip={trip} members={members} expense={editExp} onClose={()=>setEditExp(null)} onSaved={()=>{setEditExp(null);load();}}/>}
      {showShare && <ShareSheet trip={trip} onClose={()=>setShowShare(false)}/>}
      {showEdit && <EditTripSheet trip={trip} onClose={()=>setShowEdit(false)} onSaved={()=>{setShowEdit(false);load();}}/>}
    </div>
  );
}

function EditTripSheet({trip,onClose,onSaved}){
  const [name,setName]=useState(trip.name);const [cur,setCur]=useState(trip.currency||'EGP');
  const [start,setStart]=useState(trip.start_date||'');const [end,setEnd]=useState(trip.end_date||'');const [busy,setBusy]=useState(false);
  const save=async()=>{if(!name.trim())return;
    if(start&&end&&end<start){alert('End date must be after the start date.');return;}
    setBusy(true);
    const {error}=await SB.from('trips').update({name:name.trim(),currency:cur.trim()||'EGP',start_date:start||null,end_date:end||null}).eq('id',trip.id);
    setBusy(false);if(error){alert(error.message);return;}onSaved();};
  const resetSettle=async()=>{
    if(!confirm('Reset settle-ups?\n\nThis permanently deletes ALL recorded settle-ups for this trip and cannot be undone. Balances return to their pre-settlement state.'))return;
    setBusy(true);const {error}=await SB.from('settlements').delete().eq('trip_id',trip.id);setBusy(false);
    if(error){alert(error.message);return;}onSaved();};
  const delTrip=async()=>{
    if(!confirm('Delete this entire trip?\n\nThis permanently removes the trip and ALL its members, expenses and settle-ups — for everyone. This cannot be undone.'))return;
    setBusy(true);const {error}=await SB.from('trips').delete().eq('id',trip.id);setBusy(false);
    if(error){alert(error.message);return;}removeKnown(trip.id);onClose();goHome();};
  return (<Sheet onClose={onClose} title="Edit trip" sub="Set the trip name and dates.">
    <label className="fld">Trip name</label>
    <input className="input" autoFocus value={name} onChange={e=>setName(e.target.value)}/>
    <div className="two">
      <div><label className="fld">Start date</label><input className="input" type="date" value={start} onChange={e=>setStart(e.target.value)}/></div>
      <div><label className="fld">End date</label><input className="input" type="date" value={end} onChange={e=>setEnd(e.target.value)}/></div>
    </div>
    <label className="fld">Currency</label>
    <input className="input" value={cur} onChange={e=>setCur(e.target.value)} maxLength={8}/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!name.trim()} onClick={save}>{busy?'Saving…':'Save changes'}</button>
    <div style={{height:24}}/>
    <div className="section" style={{margin:'0 4px 9px',color:'var(--neg)'}}>Danger zone</div>
    <button className="btn danger" disabled={busy} onClick={resetSettle}><Ic d={I.trash} sm/> Reset all settle-ups</button>
    <div className="muted" style={{fontSize:12,margin:'8px 4px 0'}}>Permanently deletes every recorded settle-up for this trip.</div>
    {trip.created_by===MY_UID && <React.Fragment>
      <div style={{height:12}}/>
      <button className="btn danger" disabled={busy} onClick={delTrip}><Ic d={I.trash} sm/> Delete this trip</button>
      <div className="muted" style={{fontSize:12,margin:'8px 4px 0'}}>Only you (the trip creator) can do this. Removes the whole trip for everyone.</div>
    </React.Fragment>}
  </Sheet>);
}

function WhoAmI({members,tripId,onPick}){
  return (<div className="banner"><b>Which member are you</b> on this phone?
    <div style={{marginTop:9}}>{members.map(m=><span key={m.id} className="chip" onClick={()=>{setMe(tripId,m.id);onPick();}}>{m.name}</span>)}</div>
  </div>);
}

function BalancesTab({trip,members,expenses,settlements,onChange}){
  const cur=trip.currency||'EGP';const net=computeBalances(members,expenses,settlements);const transfers=simplifyDebts(net);
  const nameOf=(id)=>(members.find(m=>m.id===id)||{}).name||'?';const colorOf=(id)=>(members.find(m=>m.id===id)||{}).color||'#888';const me=getMe(trip.id);
  const settle=async(t)=>{if(!confirm('Mark '+nameOf(t.from)+' → '+nameOf(t.to)+' '+formatMoney(t.amount,cur)+' as paid?'))return;
    const {error}=await SB.from('settlements').insert({trip_id:trip.id,from_member:t.from,to_member:t.to,amount:t.amount});
    if(error){alert(error.message);return;}onChange();};
  if(members.length===0)return <div className="empty"><div className="eicon"><Ic d={I.users}/></div><div className="big">No members yet</div><div className="sub">Add members in the Members tab first.</div></div>;
  return (<React.Fragment>
    <div className="section"><Ic d={I.handshake} sm/> Who owes whom</div>
    {transfers.length===0
      ? <div className="card"><div className="row" style={{cursor:'default'}}><div className="avatar sm" style={{background:'var(--pos-soft)',color:'var(--brand2)',boxShadow:'none'}}><Ic d={I.check} sm/></div><div className="grow"><div className="title">All settled up</div><div className="meta">No outstanding balances 🎉</div></div></div></div>
      : <div className="card">{transfers.map((t,i)=>(
          <div className="row" key={i} style={{cursor:'default'}}>
            <div className="avatar sm" style={{background:avGrad(colorOf(t.from))}}>{initials(nameOf(t.from))}</div>
            <div className="grow"><div className="title" style={{fontSize:14.5}}>{nameOf(t.from)} <span className="muted" style={{fontWeight:500}}>pays</span> {nameOf(t.to)}</div><div className="meta" style={{fontWeight:750,color:'var(--pos)'}}>{formatMoney(t.amount,cur)}</div></div>
            <button className="btn small soft" onClick={()=>settle(t)}><Ic d={I.check} sm/> Settle</button>
          </div>))}
        </div>}
    <div className="section"><Ic d={I.scale} sm/> Net per person</div>
    <div className="card">{members.map(m=>{const v=net[m.id]||0;return (
      <div className="row" key={m.id} style={{cursor:'default'}}>
        <div className="avatar sm" style={{background:avGrad(m.color)}}>{initials(m.name)}</div>
        <div className="grow"><div className="title">{m.name}{m.id===me?' · you':''}</div><div className="meta">{Number(m.percent)}% share</div></div>
        {Math.abs(v)<0.005?<span className="pill flat">settled</span>:<span className={'pill '+(v>0?'pos':'neg')}>{v>0?'+':'−'}{formatMoney(Math.abs(v),cur)}</span>}
      </div>);})}
    </div>
  </React.Fragment>);
}

function ExpensesTab({trip,members,expenses,onEdit}){
  const cur=trip.currency||'EGP';const nameOf=(id)=>(members.find(m=>m.id===id)||{}).name||'?';
  if(expenses.length===0)return <div className="empty"><div className="eicon"><Ic d={I.receipt}/></div><div className="big">No expenses yet</div><div className="sub">Tap the + button to log the first one.</div></div>;

        <span style={{color:'var(--faint)'}}><Ic d={I.edit} sm/></span>

}

async function exportSummaryExcel(trip,members,expenses,settlements,onState){
  if(!window.ExcelJS){
    if(onState)onState('loading');
    try{ await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'); }catch(e){}
  }
  if(!window.ExcelJS){ if(onState)onState('error'); alert('Could not load the Excel engine. Check your connection and try again.'); return; }
  if(onState)onState('idle');
  const cur=trip.currency||'EGP';
  const net=computeBalances(members,expenses,settlements);
  const transfers=simplifyDebts(net);
  const nameOf=(id)=>(members.find(m=>m.id===id)||{}).name||'?';
  const total=expenses.reduce((s,e)=>s+Number(e.amount),0);
  const paid={};members.forEach(m=>paid[m.id]=0);expenses.forEach(e=>{if(paid[e.paid_by]!==undefined)paid[e.paid_by]+=Number(e.amount);});
  const today=new Date().toISOString().slice(0,10);
  const MONEY='"'+cur+'" #,##0.00';
  const PCT='0.0"%"';
  const BRAND='FF0B7A57',BRAND_DK='FF075C43',SOFT='FFE9F6F0',MUTE='FF6B7772',GRID='FFDDE5E1',ZEBRA='FFF5F8F6',POS='FF0B7A57',NEG='FFC2410C',WHITE='FFFFFFFF',INK='FF142019';
  const wb=new ExcelJS.Workbook();wb.creator='Bokha tripsplit';wb.created=new Date();
  const thin=()=>({style:'thin',color:{argb:GRID}});
  const boxAll=c=>{c.border={top:thin(),left:thin(),bottom:thin(),right:thin()};};
  const fill=(c,argb)=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb}};};
  function titleBlock(ws,subtitle,span){
    ws.mergeCells(1,1,1,span);const a=ws.getCell(1,1);a.value='Bokha tripsplit';a.font={bold:true,size:20,color:{argb:WHITE}};fill(a,BRAND);a.alignment={vertical:'middle',indent:1};ws.getRow(1).height=36;
    ws.mergeCells(2,1,2,span);const b=ws.getCell(2,1);b.value=subtitle;b.font={bold:true,size:13,color:{argb:WHITE}};fill(b,BRAND_DK);b.alignment={vertical:'middle',indent:1};ws.getRow(2).height=22;
    ws.mergeCells(3,1,3,span);const dts=(trip.start_date&&trip.end_date)?('Trip dates: '+trip.start_date+' to '+trip.end_date+'     |     '):'';
    const c=ws.getCell(3,1);c.value=dts+'Report date: '+today;c.font={italic:true,size:10,color:{argb:MUTE}};c.alignment={vertical:'middle',indent:1};ws.getRow(3).height=18;
  }
  function sectionHeader(ws,title,span){
    const r=ws.addRow([]);ws.mergeCells(r.number,1,r.number,span);const c=ws.getCell(r.number,1);
    c.value=title;c.font={bold:true,size:11,color:{argb:BRAND_DK}};fill(c,SOFT);c.alignment={vertical:'middle',indent:1};r.height=20;
  }
  function headerRow(ws,vals){
    const r=ws.addRow(vals);r.eachCell(c=>{c.font={bold:true,color:{argb:WHITE},size:11};fill(c,BRAND);c.alignment={vertical:'middle'};boxAll(c);});r.height=20;return r;
  }

  // ===== Summary sheet =====
  const ws=wb.addWorksheet('Summary');
  ws.columns=[{width:30},{width:18},{width:16},{width:18}];
  titleBlock(ws,trip.name+'   ·   expense summary',4);
  ws.addRow([]);
  const k=ws.addRow(['Total spent',total,'Members',members.length]);k.height=22;
  ws.getCell(k.number,1).font={bold:true,size:10,color:{argb:MUTE}};
  const tv=ws.getCell(k.number,2);tv.numFmt=MONEY;tv.font={bold:true,size:14,color:{argb:BRAND}};
  ws.getCell(k.number,3).font={bold:true,size:10,color:{argb:MUTE}};
  ws.getCell(k.number,4).font={bold:true,size:14,color:{argb:INK}};
  ws.addRow([]);

  sectionHeader(ws,'MEMBERS & BALANCES',4);
  headerRow(ws,['Member','Contribution %','Total paid','Net balance']);
  members.forEach((m,i)=>{
    const v=net[m.id]||0;const r=ws.addRow([m.name,Number(m.percent)||0,paid[m.id]||0,Math.round(v*100)/100]);
    r.getCell(2).numFmt=PCT;r.getCell(3).numFmt=MONEY;r.getCell(4).numFmt=MONEY;
    r.getCell(4).font={bold:true,color:{argb:Math.abs(v)<0.005?MUTE:(v>0?POS:NEG)}};
    if(i%2===1)r.eachCell(c=>fill(c,ZEBRA));
    r.eachCell(c=>boxAll(c));
  });
  const tot=ws.addRow(['Total',members.reduce((s,m)=>s+(Number(m.percent)||0),0),total,0]);
  tot.getCell(2).numFmt=PCT;tot.getCell(3).numFmt=MONEY;tot.getCell(4).value=null;
  tot.eachCell(c=>{c.font={bold:true,color:{argb:INK}};fill(c,SOFT);boxAll(c);});
  ws.addRow([]);
  const note=ws.addRow(['Net balance — positive = is owed, negative = owes.']);
  ws.mergeCells(note.number,1,note.number,4);ws.getCell(note.number,1).font={italic:true,size:9,color:{argb:MUTE}};
  ws.addRow([]);

  sectionHeader(ws,'WHO OWES WHOM',4);
  if(transfers.length){
    headerRow(ws,['From','To','Amount']);
    transfers.forEach((t,i)=>{
      const r=ws.addRow([nameOf(t.from),nameOf(t.to),Math.round(t.amount*100)/100]);
      r.getCell(3).numFmt=MONEY;r.getCell(3).font={bold:true,color:{argb:POS}};
      if(i%2===1)[1,2,3].forEach(ci=>fill(r.getCell(ci),ZEBRA));
      [1,2,3].forEach(ci=>boxAll(r.getCell(ci)));
    });
  }else{
    const r=ws.addRow(['All settled up — no outstanding balances.']);
    ws.mergeCells(r.number,1,r.number,4);r.getCell(1).font={bold:true,color:{argb:POS}};
  }
  ws.views=[{state:'frozen',ySplit:3,showGridLines:false}];

  // ===== Expenses sheet =====
  const es=wb.addWorksheet('Expenses');
  es.columns=[{width:13},{width:34},{width:15},{width:18},{width:16}];
  titleBlock(es,trip.name+'   ·   all expenses',5);
  es.addRow([]);
  const eh=headerRow(es,['Date','Description','Category','Paid by','Amount']);
  expenses.slice().sort((a,b)=>((a.spent_on||'')<(b.spent_on||'')?1:-1)).forEach((e,i)=>{
    const r=es.addRow([e.spent_on,e.description,e.category||'—',nameOf(e.paid_by),Math.round(Number(e.amount)*100)/100]);
    r.getCell(5).numFmt=MONEY;
    if(i%2===1)r.eachCell(c=>fill(c,ZEBRA));
    r.eachCell(c=>boxAll(c));
  });
  const er=es.addRow(['Total','','','',Math.round(total*100)/100]);
  es.mergeCells(er.number,1,er.number,4);
  er.getCell(1).value='Total';er.getCell(1).font={bold:true,color:{argb:INK}};er.getCell(1).alignment={horizontal:'right',indent:1};
  er.getCell(5).numFmt=MONEY;er.getCell(5).font={bold:true,color:{argb:BRAND}};
  [1,5].forEach(ci=>{fill(er.getCell(ci),SOFT);});[1,2,3,4,5].forEach(ci=>boxAll(er.getCell(ci)));
  es.views=[{state:'frozen',ySplit:eh.number,showGridLines:false}];

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=trip.name.replace(/[^a-z0-9]+/gi,'_')+'_summary_'+today+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
}

function SummaryTab({trip,members,expenses,settlements}){
  const [exporting,setExporting]=useState(false);
  const cur=trip.currency||'EGP';
  const total=expenses.reduce((s,e)=>s+Number(e.amount),0);
  if(expenses.length===0)return <div className="empty"><div className="eicon"><Ic d={I.chart}/></div><div className="big">No data yet</div><div className="sub">Add some expenses to see your trip summary.</div></div>;
  const byCat={};expenses.forEach(e=>{const c=e.category||'Other';byCat[c]=(byCat[c]||0)+Number(e.amount);});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const byPayer={};members.forEach(m=>byPayer[m.id]=0);expenses.forEach(e=>{if(byPayer[e.paid_by]!==undefined)byPayer[e.paid_by]+=Number(e.amount);});
  return (<React.Fragment>
    <button className="btn primary" disabled={exporting} onClick={()=>exportSummaryExcel(trip,members,expenses,settlements,(st)=>setExporting(st==='loading'))}><Ic d={I.download}/> {exporting?'Preparing…':'Download Excel summary'}</button>
    <div className="section"><Ic d={I.chart} sm/> Spending by category</div>
    <div className="card" style={{padding:'4px 0'}}>
      {cats.map(([c,amt])=>{const cat=CAT[c]||CAT.Other;const pct=total?Math.round(amt/total*100):0;return (
        <div key={c} style={{padding:'13px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div className="catico" style={{background:cat.c+'1f',color:cat.c}}><Ic d={cat.i}/></div>
            <div className="grow"><div className="title">{c}</div><div className="meta">{pct}% of total</div></div>
            <div className="amt">{formatMoney(amt,cur)}</div>
          </div>
          <div style={{height:7,borderRadius:6,background:'#eef2f0',marginTop:10,overflow:'hidden'}}><div style={{height:'100%',width:pct+'%',background:cat.c,borderRadius:6,transition:'width .4s'}}/></div>
        </div>);})}
    </div>
    <div className="section"><Ic d={I.users} sm/> Paid by each person</div>
    <div className="card">{members.map(m=>(
      <div className="row" key={m.id} style={{cursor:'default'}}>
        <div className="avatar sm" style={{background:avGrad(m.color)}}>{initials(m.name)}</div>
        <div className="grow"><div className="title">{m.name}</div></div>
        <div className="amt">{formatMoney(byPayer[m.id]||0,cur)}</div>
      </div>))}
    </div>
  </React.Fragment>);
}

function MembersTab({trip,members,onChange}){
  const [local,setLocal]=useState(members.map(m=>({...m})));const [newName,setNewName]=useState('');const [newEmail,setNewEmail]=useState('');const [busy,setBusy]=useState(false);const [editM,setEditM]=useState(null);
  useEffect(()=>{setLocal(members.map(m=>({...m})));},[members]);
  const total=local.reduce((s,m)=>s+(Number(m.percent)||0),0);const totalRounded=Math.round(total*100)/100;
  const setPct=(id,val)=>setLocal(local.map(m=>m.id===id?{...m,percent:val}:m));
  const splitEqually=()=>{const n=local.length;if(n===0)return;const each=Math.floor((100/n)*100)/100;const next=local.map(m=>({...m,percent:each}));const used=each*n;next[0].percent=Math.round((each+(100-used))*100)/100;setLocal(next);};
  const addMember=async()=>{if(!newName.trim())return;setBusy(true);const color=COLORS[members.length%COLORS.length];
    const {error}=await SB.from('members').insert({trip_id:trip.id,name:newName.trim(),email:newEmail.trim()||null,color,percent:0});setBusy(false);
    if(error){alert(error.message);return;}setNewName('');setNewEmail('');onChange();};
  const savePercents=async()=>{
    const tt=local.reduce((s,m)=>s+(Number(m.percent)||0),0);
    if(Math.abs(tt-100)>0.01){alert('Contribution percentages must add up to 100% (currently '+(Math.round(tt*100)/100)+'%). Use “Split equally” or adjust the values.');return;}
    setBusy(true);for(const m of local){await SB.from('members').update({percent:Number(m.percent)||0}).eq('id',m.id);}setBusy(false);onChange();};
  return (<React.Fragment>
    <div className="section"><Ic d={I.scale} sm/> Members &amp; contribution %</div>
    <div className="card">
      {local.length===0 && <div className="row" style={{cursor:'default'}}><div className="grow muted">No members yet. Add the first below.</div></div>}
      {local.map(m=>(
        <div className="pct-row" key={m.id}>
          <div className="avatar sm" style={{background:avGrad(m.color)}}>{initials(m.name)}</div>
          <div className="grow" onClick={()=>setEditM(m)} style={{cursor:'pointer'}}><div className="title">{m.name}</div><div className="meta">{m.email||'no email'}</div></div>
          <input className="input pct-input" type="number" inputMode="decimal" min="0" max="100" value={m.percent} onChange={e=>setPct(m.id,e.target.value)}/>
          <span className="muted">%</span>
        </div>))}
      {local.length>0 && <div className={'pct-total '+(Math.abs(totalRounded-100)<0.005?'ok':'bad')}><span>Total</span><span>{totalRounded}% {Math.abs(totalRounded-100)<0.005?'✓':'(must be 100%)'}</span></div>}
    </div>
    {local.length>0 && <div className="two"><button className="btn outline" onClick={splitEqually}>Split equally</button><button className="btn primary" disabled={busy} onClick={savePercents}>{busy?'Saving…':'Save %'}</button></div>}
    <div className="section"><Ic d={I.plus} sm/> Add member</div>
    <div className="card" style={{padding:15}}>
      <input className="input" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Name" maxLength={30}/>
      <div style={{height:10}}/>
      <input className="input" type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)} placeholder="Email (optional — for notifications)"/>
      <div style={{height:12}}/>
      <button className="btn primary" disabled={busy||!newName.trim()} onClick={addMember}><Ic d={I.plus}/> Add member</button>
    </div>
    {editM && <MemberSheet trip={trip} member={editM} onClose={()=>setEditM(null)} onSaved={()=>{setEditM(null);onChange();}}/>}
  </React.Fragment>);
}

function MemberSheet({trip,member,onClose,onSaved}){
  const [name,setName]=useState(member.name);const [email,setEmail]=useState(member.email||'');const [busy,setBusy]=useState(false);
  const save=async()=>{if(!name.trim())return;setBusy(true);
    const {error}=await SB.from('members').update({name:name.trim(),email:email.trim()||null}).eq('id',member.id);setBusy(false);
    if(error){alert(error.message);return;}onSaved();};
  const del=async()=>{if(!confirm('Remove '+member.name+'? Their expenses will also be removed.'))return;setBusy(true);await SB.from('members').delete().eq('id',member.id);setBusy(false);onSaved();};
  return (<Sheet onClose={onClose} title="Edit member">
    <label className="fld">Name</label>
    <input className="input" value={name} onChange={e=>setName(e.target.value)}/>
    <label className="fld">Email (optional)</label>
    <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@email.com"/>
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!name.trim()} onClick={save}>{busy?'Saving…':'Save'}</button>
    <div style={{height:10}}/>
    <button className="btn danger" disabled={busy} onClick={del}><Ic d={I.trash} sm/> Remove member</button>
  </Sheet>);
}

function ExpenseSheet({trip,members,expense,onClose,onSaved}){
  const editing=!!expense;const cur=trip.currency||'EGP';const me=getMe(trip.id);
  const [amount,setAmount]=useState(expense?String(expense.amount):'');
  const [desc,setDesc]=useState(expense?expense.description:'');
  const [category,setCategory]=useState(expense?(expense.category||''):'');
  const [paidBy,setPaidBy]=useState(expense?expense.paid_by:(me||(members[0]&&members[0].id)||''));
  const [date,setDate]=useState(expense?expense.spent_on:new Date().toISOString().slice(0,10));
  const [busy,setBusy]=useState(false);
  const amt=Number(amount)||0;
  const save=async()=>{if(!amt||!desc.trim()||!paidBy)return;setBusy(true);
    const payload={trip_id:trip.id,description:desc.trim(),amount:amt,category:category||null,paid_by:paidBy,spent_on:date};
    let error;
    if(editing){({error}=await SB.from('expenses').update(payload).eq('id',expense.id));}
    else{({error}=await SB.from('expenses').insert(payload));}
    setBusy(false);if(error){alert(error.message);return;}
    onSaved();};
  const del=async()=>{if(!confirm('Delete this expense?'))return;setBusy(true);await SB.from('expenses').delete().eq('id',expense.id);setBusy(false);onSaved();};
  return (<Sheet onClose={onClose} title={editing?'Edit expense':'New expense'}>
    <div className="card" style={{padding:'10px 0',marginBottom:14,background:'var(--pos-soft)',boxShadow:'none'}}>
      <input className="input amount-input" type="number" inputMode="decimal" autoFocus={!editing} value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={{color:'var(--brand-deep)'}}/>
      <div className="center" style={{marginTop:-2,fontWeight:700,color:'var(--brand2)'}}>{cur}</div>
    </div>
    <label className="fld">Description</label>
    <input className="input" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="e.g. Dinner at the taverna" maxLength={60}/>
    <label className="fld">Category</label>
    <div>{CATEGORIES.map(c=><span key={c} className={'chip'+(category===c?' on':'')} onClick={()=>setCategory(category===c?'':c)}><Ic d={CAT[c].i} sm/>{c}</span>)}</div>
    <div className="two">
      <div><label className="fld">Paid by</label>
        <select className="input" value={paidBy} onChange={e=>setPaidBy(e.target.value)}>{members.map(m=><option key={m.id} value={m.id}>{m.name}{m.id===me?' (you)':''}</option>)}</select>
      </div>
      <div><label className="fld">Date</label><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
    </div>
    {amt>0 && <React.Fragment>
      <label className="fld">Split by contribution %</label>
      <div className="card">{members.map(m=>(
        <div className="row" key={m.id} style={{cursor:'default',padding:'11px 16px'}}>
          <div className="avatar sm" style={{background:avGrad(m.color)}}>{initials(m.name)}</div>
          <div className="grow"><span className="muted">{m.name} · {Number(m.percent)}%</span></div>
          <div className="amt" style={{fontSize:14}}>{formatMoney(amt*(Number(m.percent)||0)/100,cur)}</div>
        </div>))}
      </div>
    </React.Fragment>}
    <div className="spacer"/>
    <button className="btn primary" disabled={busy||!amt||!desc.trim()||!paidBy} onClick={save}>{busy?'Saving…':(editing?'Save changes':'Save expense')}</button>
    {editing && <React.Fragment><div style={{height:10}}/><button className="btn danger" disabled={busy} onClick={del}><Ic d={I.trash} sm/> Delete expense</button></React.Fragment>}
  </Sheet>);
}

function ShareSheet({trip,onClose}){
  const link=shareLink(trip.id);const [copied,setCopied]=useState('');
  const copy=async(text,what)=>{try{await navigator.clipboard.writeText(text);setCopied(what);setTimeout(()=>setCopied(''),1500);}catch{prompt('Copy this:',text);}};
  return (<Sheet onClose={onClose} title="Share this trip" sub="Send the link or code to your friends so they can join from their phones.">
    <label className="fld">Join code</label>
    <div className="card"><div className="row" style={{cursor:'default'}}>
      <div className="grow" style={{fontSize:26,letterSpacing:5,fontWeight:800,color:'var(--brand2)'}}>{trip.join_code}</div>
      <button className="btn small soft" onClick={()=>copy(trip.join_code,'code')}><Ic d={I.copy} sm/>{copied==='code'?'Copied':'Copy'}</button>
    </div></div>
    <label className="fld">Direct link</label>
    <div className="card"><div className="row" style={{cursor:'default'}}>
      <div className="grow muted" style={{fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{link}</div>
      <button className="btn small soft" onClick={()=>copy(link,'link')}><Ic d={I.copy} sm/>{copied==='link'?'Copied':'Copy'}</button>
    </div></div>
    <div className="spacer"/>
    <button className="btn outline" onClick={()=>{removeKnown(trip.id);goHome();}} style={{color:'var(--neg)'}}>Remove this trip from my phone</button>
  </Sheet>);
}

function Sheet({title,sub,children,onClose}){
  return (<div className="sheet-bg" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}><div className="grab"/><h2>{title}</h2>{sub && <p className="ssub">{sub}</p>}{children}</div></div>);
}
